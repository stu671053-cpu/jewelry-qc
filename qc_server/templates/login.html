<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理端登录 - 珠宝检测AI自查系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    background: rgba(255,255,255,0.06); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    padding: 48px 40px; width: 380px; max-width: 90vw;
  }
  .login-box h2 {
    color: #e2e8f0; font-size: 22px; text-align: center; margin-bottom: 6px;
  }
  .login-box .sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 32px; }
  .login-box label { color: #cbd5e1; font-size: 13px; margin-bottom: 6px; display: block; }
  .login-box input {
    width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; background: rgba(255,255,255,0.08); color: #f1f5f9;
    font-size: 15px; margin-bottom: 18px; outline: none;
    transition: border-color 0.2s;
  }
  .login-box input:focus { border-color: #3b82f6; }
  .login-box button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #3b82f6; color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
  }
  .login-box button:hover { background: #2563eb; }
  .error { color: #ef4444; text-align: center; font-size: 13px; margin-top: 12px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <h2>珠宝检测AI自查系统</h2>
  <div class="sub">管理端登录</div>
  <form onsubmit="doLogin(event)">
    <label>用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" required autofocus>
    <label>密码</label>
    <div style="position:relative">
      <input type="password" id="password" placeholder="请输入密码" required style="padding-right:40px">
      <span onclick="togglePwd()" id="eyeIcon" style="position:absolute;right:12px;top:13px;cursor:pointer;color:#94a3b8;font-size:16px;user-select:none">👁</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:18px">
      <input type="checkbox" id="remember" style="width:auto;margin:0">
      <label style="margin:0;font-size:12px;color:#94a3b8">记住密码</label>
    </div>
    <button type="submit">登 录</button>
  </form>
  <div id="error" class="error"></div>
</div>
<script>
var pwdVisible = false;
function togglePwd() {
  pwdVisible = !pwdVisible;
  document.getElementById('password').type = pwdVisible ? 'text' : 'password';
  document.getElementById('eyeIcon').textContent = pwdVisible ? '🙈' : '👁';
}

// 记住密码
(function() {
  var saved = localStorage.getItem('qc_admin_user');
  if (saved) {
    var parts = saved.split(':');
    document.getElementById('username').value = parts[0] || '';
    document.getElementById('password').value = parts[1] || '';
    document.getElementById('remember').checked = true;
  }
})();

async function doLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  // 记住密码
  if (document.getElementById('remember').checked) {
    localStorage.setItem('qc_admin_user', u + ':' + p);
  } else {
    localStorage.removeItem('qc_admin_user');
  }
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const d = await r.json();
    if (d.success) {
      window.location.href = '/admin';
    } else {
      const err = document.getElementById('error');
      err.textContent = d.message || '登录失败';
      err.className = 'error show';
    }
  } catch(e) {
    document.getElementById('error').textContent = '网络错误，请重试';
    document.getElementById('error').className = 'error show';
  }
}
</script>
</body>
</html>
